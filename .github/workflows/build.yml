name: Build XRK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: pip install aqtinstall==3.1.18

      - name: Install Qt6
        run: aqt install-qt windows desktop 6.7.3 win64_msvc2022_64 --outputdir ${{ github.workspace }}/Qt

      - name: Set Qt Environment
        shell: pwsh
        run: |
          $QtDir = "${{ github.workspace }}/Qt/6.7.3/msvc2022_64"
          echo "Qt6_DIR=$QtDir" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$QtDir" >> $env:GITHUB_ENV
          echo "$QtDir/bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build_win_x64 -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_win_x64 --config Release --target xrk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrk-windows-x64
          path: build_win_x64/src/Release/xrk.exe
          retention-days: 30

  build-macos-apple-silicon:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and FFmpeg via Homebrew
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap 2>/dev/null || true
          brew install qt@6 ninja ffmpeg

      - name: Set Qt Environment
        run: |
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -B build_macos_arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_macos_arm64

      - name: Create App Bundle
        run: $(brew --prefix qt@6)/bin/macdeployqt build_macos_arm64/xrk.app -verbose=2

      - name: Zip App Bundle
        run: cd build_macos_arm64 && zip -r ../xrk-macos-arm64.zip xrk.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrk-macos-arm64
          path: xrk-macos-arm64.zip
          retention-days: 30

  build-macos-intel:
    name: macOS Intel (x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and FFmpeg via Homebrew
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap 2>/dev/null || true
          brew install qt@6 ninja ffmpeg

      - name: Set Qt Environment
        run: |
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -B build_macos_x64 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_macos_x64

      - name: Create App Bundle
        run: $(brew --prefix qt@6)/bin/macdeployqt build_macos_x64/xrk.app -verbose=2

      - name: Zip App Bundle
        run: cd build_macos_x64 && zip -r ../xrk-macos-x64.zip xrk.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrk-macos-x64
          path: xrk-macos-x64.zip
          retention-days: 30

  build-macos-universal:
    name: macOS Universal Binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and FFmpeg via Homebrew
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap 2>/dev/null || true
          brew install qt@6 ninja ffmpeg

      - name: Set Qt Environment
        run: |
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build_macos_universal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build_macos_universal

      - name: Create App Bundle
        run: $(brew --prefix qt@6)/bin/macdeployqt build_macos_universal/xrk.app -verbose=2

      - name: Zip App Bundle
        run: cd build_macos_universal && zip -r ../xrk-macos-universal.zip xrk.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrk-macos-universal
          path: xrk-macos-universal.zip
          retention-days: 30

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-tools-dev qt6-base-dev-tools \
            qt6-multimedia-dev qt6-websockets-dev \
            libqt6sql6-sqlite libqt6test6 \
            libx11-dev libxtst-dev libxext-dev \
            libavcodec-dev libavutil-dev libswscale-dev

      - name: Configure CMake
        run: cmake -B build_linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_linux 2>&1 | tail -50

      - name: Package
        run: cd build_linux && tar -czf ../xrk-linux-x64.tar.gz src/xrk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrk-linux-x64
          path: xrk-linux-x64.tar.gz
          retention-days: 30

  build-linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-tools-dev qt6-base-dev-tools \
            qt6-multimedia-dev qt6-websockets-dev \
            libqt6sql6-sqlite libqt6test6 \
            libfuse2 libxcb-cursor0 \
            libx11-dev libxtst-dev libxext-dev \
            libavcodec-dev libavutil-dev libswscale-dev

      - name: Configure CMake
        run: |
          cmake -B build_appimage -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cmake --build build_appimage 2>&1 | tail -50
          DESTDIR=AppDir cmake --install build_appimage

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/xrk.desktop \
            --icon-file resources/icons/xrk.png \
            --output appimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrk-linux-appimage
          path: '*.AppImage'
          retention-days: 30
